<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片裁剪 - 图片工具箱</title>
    <meta
      name="description"
      content="在线图片裁剪工具，支持自定义尺寸、公众号首图、网站大图和常用比例裁剪。图片在浏览器本地处理，不上传图片。"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://pictool.com.cn/crop.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="图片工具箱" />
    <meta property="og:title" content="图片裁剪 - 图片工具箱" />
    <meta
      property="og:description"
      content="支持尺寸调整和比例裁剪的在线图片裁剪工具，适合公众号配图和网站头图制作。"
    />
    <meta property="og:url" content="https://pictool.com.cn/crop.html" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="图片裁剪 - 图片工具箱" />
    <meta
      name="twitter:description"
      content="在线裁剪图片，支持公众号首图、网站大图和常用比例，全部在浏览器本地处理。"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "图片裁剪",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "url": "https://pictool.com.cn/crop.html",
        "description": "在线图片裁剪工具，支持自定义尺寸、公众号首图、网站大图和常见比例裁剪，基础处理在浏览器本地完成。",
        "inLanguage": "zh-CN",
        "featureList": [
          "支持尺寸预设",
          "支持比例裁剪",
          "支持 PNG 和 JPG 导出",
          "处理过程不上传图片"
        ]
      }
    </script>
  </head>
  <body>
    <main class="page-shell compressor-shell editor-shell">
      <nav class="subnav" aria-label="页面导航">
        <a href="index.html">← 返回工具箱</a>
      </nav>

      <section class="compressor editor-card" aria-labelledby="crop-title">
        <div class="compressor-head">
          <h1 id="crop-title">图片裁剪</h1>
        </div>

        <div class="crop-layout">
          <aside class="crop-sidebar" aria-label="裁剪设置">
            <label class="mini-uploader">
              <input id="cropFileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/bmp,image/tiff,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.gif,.avif,.bmp,.dib,.tif,.tiff,.heic,.heif" />
              <span>选择图片</span>
            </label>

            <div class="crop-mode-groups" aria-label="裁剪模式">
              <details class="crop-mode-group active" id="sizeGroup">
                <summary data-mode="size">
                  <span>尺寸调整</span>
                  <b id="sizeSummaryText">自定义尺寸</b>
                </summary>
                <div class="preset-list" id="sizePanel">
                  <button class="active" type="button" data-size="custom">自定义尺寸</button>
                  <button type="button" data-size="wechat-main">公众号首图 <span>900 × 383</span></button>
                  <button type="button" data-size="wechat-sub">公众号次图 <span>200 × 200</span></button>
                  <button type="button" data-size="web-2k">网站大图2k <span>1920 × 960</span></button>
                  <button type="button" data-size="web-4k">网站大图4k <span>3840 × 1920</span></button>
                </div>
              </details>

              <details class="crop-mode-group" id="ratioGroup">
                <summary data-mode="ratio">
                  <span>比例裁剪</span>
                  <b id="ratioSummaryText">自由裁剪</b>
                </summary>
                <div class="preset-list" id="ratioPanel">
                  <button class="active" type="button" data-ratio="free">自由裁剪</button>
                  <button type="button" data-ratio="1:1">1:1 正方形</button>
                  <button type="button" data-ratio="2:3">2:3 竖图</button>
                  <button type="button" data-ratio="3:2">3:2 横图</button>
                  <button type="button" data-ratio="3:4">3:4 竖屏</button>
                  <button type="button" data-ratio="4:3">4:3 横屏</button>
                  <button type="button" data-ratio="9:16">9:16 竖屏</button>
                  <button type="button" data-ratio="16:9">16:9 横屏</button>
                  <button type="button" data-ratio="9:18">9:18 全面屏</button>
                </div>
              </details>
            </div>

            <div class="dimension-row crop-dimensions">
              <label>
                <span>宽度</span>
                <input id="cropWidthInput" type="number" min="1" placeholder="宽" />
              </label>
              <label>
                <span>高度</span>
                <input id="cropHeightInput" type="number" min="1" placeholder="高" />
              </label>
            </div>

            <div class="smart-crop-panel">
              <label class="smart-crop-toggle">
                <span>
                  <strong>智能构图</strong>
                  <small>自动调整裁剪框位置，优先保留人物或画面重点。</small>
                </span>
                <input id="smartCropToggle" type="checkbox" />
              </label>
              <button class="secondary-action smart-crop-button" id="smartCropButton" type="button" disabled>
                重新智能构图
              </button>
              <p class="smart-crop-status" id="smartCropStatus">智能构图在当前浏览器中完成，图片不会上传。</p>
            </div>

            <div class="download-row crop-actions">
              <button id="cropApplyButton" type="button" disabled>应用</button>
              <button id="cropResetButton" type="button">重置</button>
            </div>
            <label class="crop-format">
              <span>导出格式 <b id="cropOutputSize">--</b></span>
              <select id="cropFormatSelect">
                <option value="image/png">PNG</option>
                <option value="image/jpeg" selected>JPG</option>
              </select>
            </label>
            <button class="compress-button" id="cropDownloadButton" type="button" disabled>下载图片</button>
            <button class="secondary-action" id="sendToCompressButton" type="button" disabled>图片压缩</button>
            <p class="status" id="cropStatusText" role="status">等待上传图片</p>
          </aside>

          <div class="crop-main">
            <div class="crop-stage" id="cropStage">
              <div class="empty-state">
                <span></span>
                <p>上传图片后开始裁剪</p>
                <small>可拖拽图片到此处</small>
              </div>
              <img id="cropImage" alt="待裁剪图片" />
              <div class="crop-box" id="cropBox">
                <span class="crop-grid-line v1"></span>
                <span class="crop-grid-line v2"></span>
                <span class="crop-grid-line h1"></span>
                <span class="crop-grid-line h2"></span>
                <button class="crop-handle nw" type="button" data-handle="nw" aria-label="调整左上角"></button>
                <button class="crop-handle ne" type="button" data-handle="ne" aria-label="调整右上角"></button>
                <button class="crop-handle sw" type="button" data-handle="sw" aria-label="调整左下角"></button>
                <button class="crop-handle se" type="button" data-handle="se" aria-label="调整右下角"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?f6623bd7e98bf6bb1a3c7db48623068e";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
    <script src="analytics.js"></script>
    <script src="image-support.js"></script>
    <script type="module" src="crop.js"></script>
  </body>
</html>
