<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片压缩 - 图片工具箱</title>
    <meta
      name="description"
      content="在线图片压缩工具，支持批量压缩 JPG、PNG、WebP、GIF、AVIF、BMP、TIFF、HEIC/HEIF 等图片，上传后自动压缩，可调整导出格式和压缩质量。"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://pictool.com.cn/compress.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="图片工具箱" />
    <meta property="og:title" content="图片压缩 - 图片工具箱" />
    <meta
      property="og:description"
      content="在线压缩 JPG、PNG、WebP 图片，支持自定义质量和尺寸。"
    />
    <meta property="og:url" content="https://pictool.com.cn/compress.html" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="图片压缩 - 图片工具箱" />
    <meta
      name="twitter:description"
      content="在线压缩图片，支持质量和尺寸调节。"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "图片压缩",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "isAccessibleForFree": true,
        "url": "https://pictool.com.cn/compress.html",
        "description": "在线图片压缩工具，支持 JPG、PNG、WebP，上传后自动压缩，可自定义导出格式和压缩质量。",
        "inLanguage": "zh-CN",
        "featureList": [
          "支持批量压缩",
          "支持 JPG、PNG、WebP、GIF、AVIF、BMP、TIFF、HEIC/HEIF",
          "支持压缩质量调节",
          "上传后自动压缩"
        ]
      }
    </script>
  </head>
  <body>
    <main class="page-shell compressor-shell">
      <nav class="subnav" aria-label="页面导航">
        <a href="index.html">← 返回工具箱</a>
      </nav>

      <section class="compressor" id="compressor" aria-labelledby="compressor-title">
        <div class="compressor-head">
          <div class="page-heading">
            <h1 id="compressor-title">图片压缩</h1>
            <p class="page-brief">上传图片后调整格式、质量和尺寸。</p>
          </div>
        </div>

        <div class="compressor-grid">
          <div class="upload-panel" id="uploadPanel">
            <label class="dropzone" id="dropzone">
              <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/bmp,image/tiff,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.gif,.avif,.bmp,.dib,.tif,.tiff,.heic,.heif" multiple />
              <span class="upload-icon">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                  <path d="M24 34V10m0 0-8 8m8-8 8 8" />
                  <path d="M10 34v4h28v-4" />
                </svg>
              </span>
              <strong id="dropzoneTitle">拖拽、粘贴或选择多张图片</strong>
              <small id="dropzoneHint">支持批量压缩 JPG、PNG、WebP、GIF、AVIF、BMP、TIFF、HEIC/HEIF 等图片</small>
              <span class="choose-button" id="chooseButton">选择图片（可多选）</span>
            </label>

            <div class="settings" aria-label="压缩设置">
              <label>
                <span>导出格式</span>
                <select id="formatSelect">
                  <option value="image/jpeg" selected>JPEG</option>
                  <option value="image/webp">WebP</option>
                  <option value="image/png">PNG</option>
                </select>
              </label>

              <label>
                <span>压缩质量 <b id="qualityValue">78%</b></span>
                <input id="qualityRange" type="range" min="10" max="100" value="78" />
              </label>
            </div>

            <div class="batch-panel hidden" id="batchPanel">
              <div class="batch-summary">
                <strong id="batchSummaryText">已选择 0 张图片</strong>
                <span id="batchProgressText">等待压缩</span>
              </div>
              <div class="batch-strip" id="batchStrip" aria-label="批量图片缩略图"></div>
            </div>

            <p class="status" id="statusText" role="status">等待上传图片</p>

            <div class="compress-actions" aria-label="图片操作">
              <button id="batchZipButton" type="button" disabled>下载压缩图片</button>
              <button id="resetButton" type="button" disabled>清空</button>
            </div>
          </div>

          <div class="preview-panel">
            <div class="preview-stage" id="previewStage" aria-label="使用鼠标滚轮缩放预览，放大后拖动图片移动查看，拖动分割线对比压缩前后效果">
              <div class="empty-state">
                <span></span>
                <p>上传图片后查看压缩前后效果</p>
                <small>拖动分割线对比压缩效果</small>
              </div>
              <div class="preview-zoom-controls" aria-label="预览缩放">
                <button class="preview-zoom-button" id="zoomOutButton" type="button" aria-label="缩小预览" disabled>−</button>
                <output id="previewZoomValue" aria-live="polite">100%</output>
                <button class="preview-zoom-button" id="zoomInButton" type="button" aria-label="放大预览" disabled>+</button>
              </div>
              <div class="preview-image-layer preview-original-layer">
                <img id="originalPreview" alt="原图预览" />
              </div>
              <div class="preview-image-layer preview-compressed-layer" id="compressedPreviewLayer">
                <img id="compressedPreview" alt="压缩后预览" />
              </div>
              <div class="compare-mask" id="compareMask"></div>
            </div>

            <div class="stats-grid">
              <div>
                <small>原图大小</small>
                <strong id="originalSize">--</strong>
              </div>
              <div>
                <small>压缩后</small>
                <strong id="compressedSize">--</strong>
              </div>
              <div>
                <small id="savedSizeLabel">节省空间</small>
                <strong id="savedSize">--</strong>
              </div>
              <div>
                <small>尺寸</small>
                <strong id="imageSize">--</strong>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?f6623bd7e98bf6bb1a3c7db48623068e";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
    <script src="analytics.js"></script>
    <script src="image-support.js"></script>
    <script src="compress.js"></script>
  </body>
</html>
